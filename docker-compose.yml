services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subsonic-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./subsonicFestival
      dockerfile: Dockerfile
    container_name: subsonic-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
