services:
  mysql:
    image: mysql:8.4
    container_name: subsonic-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-subsonic_festival}
      MYSQL_USER: ${MYSQL_USER:-subsonic_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-subsonic_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: always

  backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile-backend
    container_name: subsonic-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://subsonic_user:subsonic_password@mysql:3306/subsonic_festival?charset=utf8mb4}
    volumes:
      - ../backend/firebase-claves.json:/app/firebase-claves.json:ro
    restart: always

  frontend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile-frontend
    container_name: subsonic-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: always

volumes:
  mysql_data:
